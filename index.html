        //1.second-highest score

        function secondHighest(scores) {
            let highest = null;
            let second= null;

            for(const score of scores) {
                if(highest === null || score > highest){
                    second = highest;
                    highest = score;
                } else if (score !== highest && (second === null || score > second)){
                    second = score;
                }
            }

            return second;
        }

        function removeDuplicate(ids) {
            const uniqueIds = [];

            for (const id of ids){
                if (!uniqueIds.includes(id)){

        // 5. Finding the missing roll number

        function findMissingRollNumber(rollNumbers, n){
            const expectedSum = (n * (n + 1)) / 2;
            const actualSum = rollNumbers.reduce((sum, number) => sum +number, 0);

            return expectedSum - actualSum;
        }

        //6. Check whether text is palindrome

        function isPalindrome(text) {
            let left = 0;
            let right = text.length - 1;

            while (left < right) {
                if (text[left] !== text[right]) {
                    return false;
                }
                left++;
                right--;
            }

            return true;

        }
